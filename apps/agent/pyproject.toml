[project]
name = "zanoba-agent"
version = "0.1.0"
description = "Zanoba AI tutoring platform — ADK agent service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.8.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=3.13.1",
    "markdown>=3.10.3",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/zanoba_agent"]
